<div class="container" id="front-page">

</div>

<div class="container hidden" id="exam-page">

</div>

<div class="container hidden" id="result-page">

  </header>
  <div id="result-content"></div>
</div>

<!-- Modal Konfirmasi Pengumpulan Jawaban -->
<div class="modal-overlay hidden" id="confirm-modal">

  let selectedQuestions = [];
  let studentData = {};

  function showBannerError(elementId, message) {
    const el = document.getElementById(elementId);
    el.innerText = message;
    el.classList.remove('hidden');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideBannerError(elementId) {
    const el = document.getElementById(elementId);
    if (el) el.classList.add('hidden');
  }

  function startExam() {
    try {
      hideBannerError('form-error');
      const nama = document.getElementById('nama').value.trim();
      const kelas = document.getElementById('kelas').value;
      const mapel = document.getElementById('mapel').value;

      if (!nama) {
        showBannerError('form-error', "⚠️ Harap isi Nama Lengkap Siswa terlebih dahulu!");
        document.getElementById('nama').focus();
        return;
      }
      if (!kelas) {
        showBannerError('form-error', "⚠️ Harap pilih Kelas (8A atau 8B)!");
        document.getElementById('kelas').focus();
        return;
      }
      if (!mapel) {
        showBannerError('form-error', "⚠️ Harap pilih Mata Pelajaran Ujian!");
        document.getElementById('mapel').focus();
        return;
      }

      studentData = { nama, kelas, mapel };
      
      // Pilih bank soal
      let source = mapel === "Informatika" ? bankSoal.informatika : bankSoal.koding;
      
      if (!source || source.length === 0) {
        showBannerError('form-error', "⚠️ Data soal untuk mata pelajaran ini tidak ditemukan.");
        return;
      }

      // Acak array menggunakan algoritma Fisher-Yates yang lebih akurat dan ambil 30 soal
      let shuffled = [...source];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      selectedQuestions = shuffled.slice(0, 30);

      renderExam();

      document.getElementById('front-page').classList.add('hidden');
      document.getElementById('exam-page').classList.remove('hidden');
      window.scrollTo(0, 0);
    } catch (err) {
      showBannerError('form-error', "Terjadi kesalahan sistem: " + err.message);
    }
  }

  function renderExam() {
    document.getElementById('student-name').innerText = `Nama: ${studentData.nama}`;
    document.getElementById('student-class').innerText = `Kelas: ${studentData.kelas}`;
    document.getElementById('exam-subject').innerText = `Mapel: ${studentData.mapel}`;

    const container = document.getElementById('questions-container');
    let allQuestionsHTML = "";

    selectedQuestions.forEach((q, index) => {
      let optionsHTML = "";
      q.options.forEach((opt, optIdx) => {
        optionsHTML += `
          <label class="option-item">
            <input type="radio" name="q_${index}" value="${optIdx}">
            <span>${opt}</span>
          </label>
        `;
      });

      allQuestionsHTML += `
        <div class="question-card">
          <div class="question-title">${index + 1}. ${q.soal}</div>
          <div class="options-group">
            ${optionsHTML}
          </div>
        </div>
      `;
    });

    container.innerHTML = allQuestionsHTML;
  }

  function checkBeforeSubmit() {
    hideBannerError('exam-error');
    let unans = 0;

    selectedQuestions.forEach((q, index) => {
      const selected = document.querySelector(`input[name="q_${index}"]:checked`);
      if (!selected) unans++;
    });

    if (unans > 0) {
      document.getElementById('confirm-text').innerText = 
        `Terdapat ${unans} dari 30 soal yang belum dijawab. Apakah Anda yakin ingin mengumpulkan jawaban sekarang?`;
      document.getElementById('confirm-modal').classList.remove('hidden');
    } else {
      executeSubmit();
    }
  }

  function closeModal() {
    document.getElementById('confirm-modal').classList.add('hidden');
  }

  function executeSubmit() {
    closeModal();
    let benarCount = 0;
    let jawabanRekap = [];

    selectedQuestions.forEach((q, index) => {
      const selected = document.querySelector(`input[name="q_${index}"]:checked`);
      if (selected) {
        const userAns = parseInt(selected.value);
        const optChar = String.fromCharCode(65 + userAns);
        
        if (userAns === q.jawaban) {
          benarCount++;
          jawabanRekap.push(`[No.${q.id_asli}]: ${optChar} (Benar)`);
        } else {
          jawabanRekap.push(`[No.${q.id_asli}]: ${optChar} (Salah)`);
        }
      } else {
        jawabanRekap.push(`[No.${q.id_asli}]: - (Kosong)`);
      }
    });

    let nilaiFinal = Math.round((benarCount / 30) * 100);

    const payload = {
      nama: studentData.nama,
      kelas: studentData.kelas,
      mapel: studentData.mapel,
      benar: benarCount,
      nilai: nilaiFinal,
      jawabanSiswa: jawabanRekap.join(" | ")
    };

    const btn = document.getElementById("btn-submit");
    btn.innerText = "Mengirim & Menyimpan Nilai...";
    btn.disabled = true;

    // Kirim data ke Google Sheets via Apps Script Web App
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById('exam-page').classList.add('hidden');
      document.getElementById('result-page').classList.remove('hidden');
      
      document.getElementById('result-content').innerHTML = `
        <p style="text-align: center;">Terima kasih <b>${studentData.nama}</b> (${studentData.kelas}) telah menyelesaikan latihan ujian <b>${studentData.mapel}</b>.</p>
        <div class="score-badge">
          <p>Jawaban Benar: <b>${benarCount} dari 30 Soal</b></p>
          <div class="score-num">${nilaiFinal}</div>
          <p style="color: #276749;">Nilai dan rincian jawaban telah berhasil disimpan ke Google Sheets!</p>
        </div>
        <button type="button" class="btn" style="margin-top: 20px;" onclick="location.reload()">Kembali ke Halaman Depan</button>
      `;
      window.scrollTo(0, 0);
    })
    .catch(err => {
      showBannerError('exam-error', "⚠️ Gagal terhubung ke database Google Sheets. Periksa koneksi internet Anda lalu coba klik Kirim lagi.");
      btn.innerText = "Kirim & Simpan Jawaban";
      btn.disabled = false;
    });
  }
</script>
